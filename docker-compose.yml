services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhidang}
      POSTGRES_USER: ${POSTGRES_USER:-zhidang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhidang}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1g"
        reservations:
          cpus: "0.5"
          memory: "256m"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhidang} -d ${POSTGRES_DB:-zhidang}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-zhidang}:${POSTGRES_PASSWORD:-zhidang}@postgres:5432/${POSTGRES_DB:-zhidang}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - cache_data:/app/backend/app/output
      - ./backend/static/sandbox:/app/backend/static/sandbox
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "2g"
        reservations:
          cpus: "0.5"
          memory: "256m"
    restart: unless-stopped
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"

  frontend:
    image: nginx:alpine
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "256m"
        reservations:
          cpus: "0.25"
          memory: "64m"
    restart: unless-stopped

volumes:
  pgdata:
  cache_data:
