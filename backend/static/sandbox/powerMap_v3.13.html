        origOpen.apply(this, arguments);

<script>
window.__SANDBOX_READY__ = false;
(function() {
    var checkReady = function() {
        var svg = document.querySelector('.x6-graph-svg');
        if (svg && svg.querySelectorAll('g.x6-node').length > 0) {
            window.__SANDBOX_READY__ = true;
            window.dispatchEvent(new Event('sandbox-ready'));
            return true;
        }
        return false;
    };
    document.addEventListener('DOMContentLoaded', function() {
        if (checkReady()) return;
        var observer = new MutationObserver(function() {
            if (checkReady()) observer.disconnect();
        });
        observer.observe(document.body, { childList: true, subtree: true });
        // 8s fallback — empty graphs have no x6-node elements
        setTimeout(function() {
            window.__SANDBOX_READY__ = true;
            observer.disconnect();
        }, 8000);
    });
})();
</script>

        /** 手机号可不填；占位号 999999999999 放行；否则须为国内 11 位（1 开头）或国际 E.164（+ 与数字，空格忽略） */
        function isStandardPhoneForSubmit(phone) {
            var p = String(phone == null ? "" : phone).trim().replace(/\s+/g, "");
            if (p === "") return true;
            if (p === SUPPORT_PLACEHOLDER_PHONE) return true;
            if (/^1\d{10}$/.test(p)) return true;
            if (/^\+[1-9]\d{6,14}$/.test(p)) return true;
            return false;

        function buildNodeToolTipHTML(info,node_id){
            var temp_version=(version_data && version_data["ver_name"])?version_data["ver_name"]:"";

            let tagB=info.tagB;
            let school=info.school;
            let hobby=info.hobby;
            let information=info.information;
            var innerHTML="";
            if(is_support_user){
                // 客户成功版本使用微软雅黑字体，行号换行展示，内容对齐
                let expect = node_expect_map.get(node_id);
                let expect_latest=pickLatestRows(expect,3,3);
                let hasExpect = expect_latest!=undefined && expect_latest.length>0;
                if(hasExpect){
                    innerHTML=innerHTML+"<b>客户预期：</b></br>";
                    innerHTML=innerHTML+"<div style=\"font-family:'Microsoft YaHei','微软雅黑',sans-serif;font-size:12px;line-height:1.6;\">";
                    for(var i=0;i<expect_latest.length;i++){
                        var arr=expect_latest[i];
                        var expect_str=(arr[0]&&arr[0].text)?arr[0].text:"";
                        var expect_detail=(arr[1]&&arr[1].text)?arr[1].text:"";
                        var expect_status=(arr[2]&&arr[2].text)?arr[2].text:"";
                        var expect_time=(arr[3]&&arr[3].text)?arr[3].text:"";
                        // 行号单独一行展示
                        innerHTML=innerHTML+"<div style='margin-bottom:4px;'>【"+(i+1)+"】</div>";
                        // 内容缩进对齐，使用固定宽度实现字段名对齐
                        innerHTML=innerHTML+"<div style='padding-left:16px;'>";
                        innerHTML=innerHTML+"<div>预期简述："+expect_str+"</div>";
                        innerHTML=innerHTML+"<div>预期描述："+expect_detail+"</div>";
                        innerHTML=innerHTML+"<div>预期状态："+expect_status+"</div>";
                        innerHTML=innerHTML+"<div>创建日期："+expect_time+"</div>";
                        innerHTML=innerHTML+"</div>";
                        if(i < expect_latest.length - 1){
                            innerHTML=innerHTML+"<div style='height:8px;'></div>"; // 对象之间间距
                        }
                    }
                    innerHTML=innerHTML+'</div>';
                }
                let scene = node_scene_map.get(node_id);
                let scene_latest=pickLatestRows(scene,2,3);
                let hasScene = scene_latest!=undefined && scene_latest.length>0;
                if(hasScene){
                    innerHTML=innerHTML+"<b>客户场景：</b></br>";
                    innerHTML=innerHTML+"<div style=\"font-family:'Microsoft YaHei','微软雅黑',sans-serif;font-size:12px;line-height:1.6;\">";
                    for(var m=0;m<scene_latest.length;m++){
                        var sarr=scene_latest[m];
                        var s_title=(sarr[0]&&sarr[0].text)?sarr[0].text:"";
                        var s_core=(sarr[1]&&sarr[1].text)?sarr[1].text:"";
                        var s_time=(sarr[2]&&sarr[2].text)?sarr[2].text:"";
                        // 行号单独一行展示
                        innerHTML=innerHTML+"<div style='margin-bottom:4px;'>【"+(m+1)+"】</div>";
                        // 内容缩进对齐

                        innerHTML=innerHTML+"</div>";

        // 创建并显示Tooltip（支持客户成功版本下自适应鼠标位置）
        function createToolTip(e,cell)
        {
            let node_id=cell.id;
            let info=objMap.get(node_id);
            var innerHTML=buildNodeToolTipHTML(info,node_id);

            if(innerHTML!="")
            {
                tooltip = document.createElement('div');
                tooltip.style.position = 'absolute';
                tooltip.style.padding = '5px';
                tooltip.style.backgroundColor = 'white';
                tooltip.style.border = '1px solid #ccc';
                tooltip.style.zIndex = '1000';
                tooltip.classList.add('tagtooltip');
                document.body.appendChild(tooltip);
                tooltip.innerHTML = innerHTML;

                // 客户成功版本：自适应鼠标位置，避免超出屏幕
                let temp_version=(version_data && version_data["ver_name"])?version_data["ver_name"]:"";
                let is_cs_version=(temp_version=="【客户成功】数据");
                let winWidth=window.innerWidth;
                let winHeight=window.innerHeight;
                let x=e.clientX;
                let y=e.clientY;

                if(is_cs_version){
                    // 预估tooltip尺寸（渲染后获取更准确，但先估算）
                    let estWidth=320;
                    let estHeight=200;
                    let offset=15;

                    // 水平方向：靠近右侧则显示在左侧
                    if(x + estWidth + offset > winWidth){
                        x = x - estWidth - offset;
                        if(x < 10) x = 10;
                    } else {
                        x = x + offset;
                    }

                    // 垂直方向：靠近底部则显示在上方
                    if(y + estHeight + offset > winHeight){
                        y = y - estHeight - offset;
                        if(y < 10) y = 10;

        function getQueryString(name) {

        function getBorderColorByRule(node_reach, has_expect, has_scene){
            // 客户成功版本下人员节点边框颜色规则：
            // 1. 触达=0时，边框为灰色
            if(node_reach=="0")
                return "#a2b1c3";//灰

            // 触达=1时：
            // 2. 有场景有预期且触达=1时，边框为绿色
            if(node_reach=="1" && has_expect && has_scene)
                return "#2ad089";//绿

            // 3. 触达=1且有预期无场景时，边框为黄色
            if(node_reach=="1" && has_expect && !has_scene)
                return "#fac750";//黄

            // 4. 触达=1且无预期有场景时，边框为红色
            if(node_reach=="1" && !has_expect && has_scene)
                return "#fa6446";//红

            // 5. 触达=1且无预期无场景时，边框为红色
            if(node_reach=="1" && !has_expect && !has_scene)
                return "#fa6446";//红

            return "#a2b1c3";//默认灰色
        }

        function getCellText(cell_obj){
            if(cell_obj==undefined || cell_obj==null)
                return "";
            if(typeof cell_obj === "string")
                return cell_obj;
            if(cell_obj.text!=undefined)
                return cell_obj.text;
            if(cell_obj.el!=undefined && cell_obj.el.text!=undefined)
                return cell_obj.el.text;
            return "";
        }

        function parseRowTimeByIndex(row,time_index){
            if(row==undefined || row[time_index]==undefined)
                return 0;
            let t=getCellText(row[time_index]);
            if(t=="")
                return 0;
            let ts=Date.parse(String(t).replace(/-/g,"/"));
            if(isNaN(ts))
                return 0;
            return ts;
        }

        function pickLatestRows(rows,time_index,max_len){
            let arr=[];
            if(rows!=undefined)
                arr=rows.slice(0);
            arr.sort(function(a,b){
                return parseRowTimeByIndex(b,time_index)-parseRowTimeByIndex(a,time_index);
            });
            return arr.slice(0,max_len);
        }

        function updateEdgeMap(){

            let gedges=graph.getEdges();
            for(var j=0;j<gedges.length;j++)
            {
                let edge=gedges[j];
                let tar_id=edge.getTarget().cell;

                let edge_arr=edge_map.get(tar_id);
                if(edge_arr==undefined)
                    edge_arr=[];

                edge_arr.push(edge);
                edge_map.set(tar_id,edge_arr);

                let source_id=edge.getSource().cell;
                let edge_type=edge.prop("router");//判断连接线类型
                if(edge_type!="normal")//层级连线
                {
                    var level_nodes=level_node_map.get(source_id);
                    if(level_nodes==undefined)
                        level_nodes=[];

                    level_nodes.push(tar_id);
                    level_node_map.set(source_id,level_nodes);
                }
            }
        }

            let nodes = graph.getNodes();
            let deptNodes = [];
            for (let i = 0; i < nodes.length; i++) {
                if (nodes[i].attr(".card").card_type === "dept") {
                    deptNodes.push(nodes[i]);
                }
            }
            for (let i = 0; i < deptNodes.length; i++) {
                let a = deptNodes[i];
                let bboxA = a.getBBox();
                let parentA = a.getParent();
                for (let j = i + 1; j < deptNodes.length; j++) {
                    let b = deptNodes[j];
                    let bboxB = b.getBBox();
                    if (!bboxA.isIntersectWithRect(bboxB)) {
                        continue;
                    }
                    let parentB = b.getParent();
                    let isAParentOfB = (parentB && parentB.id === a.id);
                    let isBParentOfA = (parentA && parentA.id === b.id);
                    if (isAParentOfB || isBParentOfA) {
                        continue;
                    }
                    let aContainsB = bboxA.containsRect(bboxB);
                    let bContainsA = bboxB.containsRect(bboxA);
                    if (!aContainsB && !bContainsA) {
                        return { a: a, b: b };
                    }
                }
            }
            return null;
        }

        /** 客户成功版本：被其它节点完全包含的节点展示在最上方（zIndex 随嵌套深度递增） */
        function bboxNearlyEqual(a, b) {
            if (!a || !b) return false;
            return Math.abs(a.x - b.x) < 1e-2 && Math.abs(a.y - b.y) < 1e-2
                && Math.abs(a.width - b.width) < 1e-2 && Math.abs(a.height - b.height) < 1e-2;
        }
        function isStrictlyContainedIn(innerNode, outerNode) {
            if (!innerNode || !outerNode || innerNode.id === outerNode.id) return false;
            var ib = innerNode.getBBox();
            var ob = outerNode.getBBox();
            if (!ob.containsRect(ib)) return false;
            if (bboxNearlyEqual(ib, ob)) return false;
            return true;
        }
        function applyCustomerSuccessContainmentZOrder() {
            if (!isCustomerSuccessVersion() || !graph) return;
            var nodes = graph.getNodes();
            var n = nodes.length;
            for (var i = 0; i < n; i++) {
                var node = nodes[i];
                if (!node.visible) continue;
                var depth = 0;
                for (var j = 0; j < n; j++) {
                    if (i === j) continue;
                    var other = nodes[j];
                    if (!other.visible) continue;
                    if (isStrictlyContainedIn(node, other)) depth++;
                }
                node.setZIndex(10 + depth * 10);
            }
        }

        function createNode(rank, name, dept_,phone_, xval, yval ,type_ ,if_highLight) {
            var stroke_color="#a2b1c3";
            var name_fill="##1E2432";

            var fill_color="#FFF";
            var inner_color="#FFF";
            
            //手机号为空，背景红色

                fill_color="#fbefec";
                stroke_color="#f0ad9c";

            }

            //如果高亮，背景以高亮为先
            if(if_highLight=="2")
            {
                stroke_color="#fa6446";
                fill_color="#fa6446";
            }
            
                
            return graph.createNode({
                shape: 'org-node',
                x:xval,
                y:yval,
                attrs: {
                  '.card': {
                    stroke:stroke_color,
                    fill:fill_color,
                    card_type:type_
                  },
                  '.in_card': {
                    fill:inner_color
                  }, 
                  '.dept_': {
                    text: X6.Dom.breakText(dept_, { width: 160, height: 45 }),
                  },
                  '.rank': {
                    text: X6.Dom.breakText(rank, { width: 160, height: 45 }),
                  },
                  '.name': {
                    text: X6.Dom.breakText(name, { width: 160, height: 45 }),
                    fill:name_fill
                  },
                },
            })
        };

        function createEdge(source, source_port,target,target_port) {
          let edge= null;
          try{
              edge=graph.createEdge({
                shape: 'org-edge',
                target: { cell: target.id,port: target_port },
                source: { cell: source.id,port: source_port },
              })
          }catch(err){//如果有问题，不连线
            edge=graph.createEdge({
                shape: 'org-edge'
              })
          }
          return edge;
        };

        function drawNode(json){
            let id=json["id"];
            let name=json["name"];
            let position=json["position"];
            let department=json["department"];
            let phone=json["phone"];
            let w=+json["node_width"];
            let h=+json["node_height"];
            let t=json["node_type"];

            let pid=json["pid"];
            let x=+json["x"];
            let y=+json["y"];
            let if_highLight=json["if_highLight"];
            let node_border_color=json["node_border_color"];


            let node=createNode(position, name,department,phone, x, y,t,if_highLight);
            node.attr('.card',{cont_id:json["cont_id"]});
            node.attr('.card',{id:id});
            node.attr('.card',{jdy_id:json["jdy_id"]});
            node.attr('.card',{combine_dept:json["node_parent_dept"]});

            //部门重新设置节点大小
            if(t=="dept")
            {
                node.setZIndex(0);
                node.resize(w,h);
                node.attr('.name',{refY: (20/h)}); 
                node.attr('.tagB > text',{x: (w-2)}); 
                node.attr('.in_card',{width: (w-4),height: (h-8),refX:2/w}); 

                let back_color=json["node_background"];
                node.attr('.card',{fill:back_color});
                node.attr('.card',{stroke:"#a2b1c3"});
                node.attr('.in_card',{fill:back_color});
                if(if_highLight=="2")
                    node.attr('.card',{fill:"#a2b1c3"});

                dept_posi_map.set(node.id,node.getBBox());
            }
            else if(node_border_color!=undefined && node_border_color!="")
            {
                node.attr('.card',{stroke:node_border_color});
            }
            nodes.push(node);
            node_map.set(id,node);

            let node_expect=json["node_expect"];
            if(node_expect!=undefined)
                node_expect_map.set(node.id,node_expect);

            addLabel(json,node);

            //节点信息存入objMap
            objMap.set(node.id,json);
        };

        //遍历所有节点 隐藏/展示 折叠按钮
        function showhidebtn (){
            let nodes=graph.getNodes();
            for(var j=0;j<nodes.length;j++)
            {
                let node=nodes[j];
                const son_arr = graph.getSuccessors(node, { distance: 1 });
                if(son_arr.length>0){

                    var level_nodes=level_node_map.get(node.id);

                    if(level_nodes==undefined)
                        node.attr('.btn.close',{display:"none"});
                    else{
                        const bbox = node.getBBox();
                        var w=bbox.width;
                        var h=bbox.height;
                        if(w!=160&&h!=70)
                        {
                            node.attr('.btn.close',{refDx:(0-w/2),refY:(h+6)});  
                            node.attr('.btn.close > rect',{refDx: (0-w-12.3),refY: -6.5});  
                        }

                        node.attr('.btn.close',{display:""});  
                    }
                }
                else
                    node.attr('.btn.close',{display:"none"});
                
            }
        }

        //切换版本
        function switchVersion(ver_type,obj,self){
            //先清空画布
            graph.clearCells();
            edge_map.clear();
            node_map.clear();
            nodes.length=0;
            edges.length=0;

            his_page_size=obj.his_page_size;
            his_totol_num=obj.his_totol_num;

            history_info=obj.his_arr;//历史记录
            for(let n=0;n<history_info.length;n++)
                history_size.push(60);

            node_data=obj.node_info;

            //创建节点
            for(var x=0;x<node_data.length;x++)
                drawNode(node_data[x]);

            edge_data=obj.edge_info;
            if(edge_data.length==0)
            {
                for(var y=0;y<node_data.length;y++)
                {
                    let data=node_data[y];
                    let id=data["id"];
                    let pid=data["pid"];
                    if(pid!=""&&node_map.get(pid)!=undefined)
                        edges.push(createEdge(node_map.get(pid),'port-bottom',node_map.get(id),'port-top'));
                }
            }
            else
            {
                for(var y=0;y<edge_data.length;y++)
                {
                    let data=edge_data[y];
                    let target=data["target_id"];
                    let source=data["source_id"];
                    let edge=createEdge(node_map.get(source),data["source_port"], node_map.get(target),data["target_port"]);
                    //颜色
                    if(data["color"]!="")
                        edge.attr('line/stroke', data["color"]);
                    //类型
                    if(data["edge_type"]=="normal")
                    {
                        edge.attr('line/strokeWidth', 6);
                        edge.attr('line/targetMarker', {name: 'path',stroke: data["color"],d: 'M 0 0 10 -10 -10 0 10 10 0 0 z', offsetX: -8});
                        edge.prop('zIndex', 99999);
                        edge.prop('router', 'normal');
                    }
                    //备注
                    if(data["edge_remark"]!="")
                       edge.prop('labels',[{"attrs": {"label": {"text": data["edge_remark"]}}}]);

                    edges.push(edge);
                }
            }

            graph.resetCells([...nodes, ...edges]);

            var btn_if_show=false;
            if(ver_type=="support")//仅客户成功可见
            {
                btn_if_show=is_support;
                //初始化节点组合
                for(var p=0;p<nodes.length;p++)
                {
                    var temp_node=nodes[p];
                    var combine_dept_id=temp_node.attr('.card').combine_dept;
                    if(combine_dept_id!="")
                    {
                        var dept_node=node_map.get(combine_dept_id);
                        if(dept_node){
                            dept_node.addChild(temp_node);
                        }
                    }
                }

                //左侧添加部门节点拖拽
                self_stencil.groups['contact-dept'].classList.remove('hidden');
                self_stencil.resizeGroup("contact-dept", { height: 100 });

                //添加空白部门
                let cust_node=[];
                let init_node=createNode("","待编辑","","-",0,0,'dept',1);
                init_node.attr('.card',{fill:"#e9f5e9"});
                init_node.attr('.in_card',{fill:"#e9f5e9"});

                cust_node.push(init_node);
                self_stencil.load(cust_node, 'contact-dept');

                for(var e=0;e<edges.length;e++)
                    updateSupportEdge(edges[e]);

            }
            else
            {
                btn_if_show=!is_support;
                //左侧隐藏部门节点拖拽
                self_stencil.groups['contact-dept'].classList.add('hidden');
                self_stencil.resizeGroup("contact-dept", { height: 0 });
            }

            //右上角提交按钮
            self.total_submit.setVisible(btn_if_show);
            //删除版本按钮
            self.dele_version.setVisible(btn_if_show);


            updateEdgeMap();
            showhidebtn();//判断展示折叠按钮
            flushdragable();
        }

            if(ver_name=="【客户成功】数据")
                ver_type="support";
        
            $.ajax({
                url:serverName+'/WebReport/decision/url/power_map/getInfo?prj_type='+prj_type+'&ver_info='+new_ver+"&prj_id="+com_id,
                method:'get',
                success: function(result){
                    var obj = eval('(' + result + ')');

                        competitor_map.set(competitor_obj.value,competitor_obj.text);
                    }
                    if_not_submit=false;
                }
            })
        }

                                    let up_nodes=[];

                                    // 客户成功版本下：校验是否存在人员节点无部门信息
                                    if(isCustomerSuccessVersion()){
                                        let usersWithoutDept = [];
                                        for(let i=0;i<nodes.length;i++){
                                            let node=nodes[i];
                                            let type=node.attr(".card").card_type;
                                            if(type=="user"){
                                                let info=objMap.get(node.id);
                                                let dept = info["department"];
                                                let parentNode = node.getParent();
                                                // 检查部门信息是否为空且没有父部门节点
                                                if((!dept || dept==="") && (!parentNode || parentNode===null)){
                                                    usersWithoutDept.push(info["name"] || "未命名人员");
                                                }
                                            }
                                        }
                                        if(usersWithoutDept.length > 0){
                                            BI.Msg.alert("保存失败", "人员需要保存在部门下，否则不可保存。以下人员未归属部门：" + usersWithoutDept.join("、"));
                                            return;
                                        }
                                    }

                                    if(isCustomerSuccessVersion()){
                                        let deptOverlapPair = findDeptCanvasPartialOverlapPair();
                                        if (deptOverlapPair) {
                                            let ia = objMap.get(deptOverlapPair.a.id);
                                            let ib = objMap.get(deptOverlapPair.b.id);
                                            let nameA = (ia && ia.name) ? ia.name : "部门";
                                            let nameB = (ib && ib.name) ? ib.name : "部门";
                                            BI.Msg.alert("保存失败", "部门画布之间不可出现部分重叠，请调整位置或大小后再保存。涉及：" + nameA + "、" + nameB);
                                            return;
                                        }
                                    }

                                    for(let i=0;i<nodes.length;i++)
                                    {
                                        let node=nodes[i];
                                        let info=objMap.get(node.id);
                                        info.x=parseInt(node.position().x);
                                        info.y=parseInt(node.position().y);

                                        //类型
                                        var type=node.attr(".card").card_type;
                                        info.type=type;

                                        if(type=="dept")
                                        {
                                            //长宽
                                            var bbox=node.getBBox();
                                            info.width=bbox.width;
                                            info.height=bbox.height;
                                        }
                                        //组合的部门节点（部门也可能组合）
                                        var par_id="";
                                        var par_node=node.getParent();
                                        if(par_node!=null)
                                            par_id=par_node.attr(".card").id;
                                        info.par_id=par_id;

                                        up_nodes.push(info);
                                    }
                                    let up_edges=[];
                                    let edges=graph.getEdges();

                                    for(let i=0;i<edges.length;i++)
                                    {
                                        let edge_obj={};
                                        let edge=edges[i];
                                        edge_obj.color=edge.attr('line/stroke');
                                        edge_obj.target_id=getNodeDbIdbyCreatedId(edge.getTarget().cell);
                                        edge_obj.target_port=edge.getTarget().port;
                                        edge_obj.source_id=getNodeDbIdbyCreatedId(edge.getSource().cell);
                                        edge_obj.source_port=edge.getSource().port;
                                        edge_obj.edge_type=edge.prop("router");

                                        let remark_str="";
                                        let remark_arr=edge.prop('labels');
                                        if(remark_arr!=undefined )
                                            remark_str=remark_arr[0].attrs.label.text;
                                        edge_obj.edge_remark=remark_str;
                                        up_edges.push(edge_obj);
                                    }

                                    let submit_data = {};
                                    submit_data.com_id=com_id;
                                    submit_data.up_type="nodes";
                                    submit_data.up_nodes=up_nodes;
                                    submit_data.up_edges=up_edges;
                                    submit_data.ver_id=self.version_info.getValue()[0];

                                    $.ajax({
                                        url:serverName+'/WebReport/decision/url/power_map/upInfo',
                                        method:'POST',
                                        data:JSON.stringify(submit_data),
                                        contentType: "application/json",
                                        success: function(result){

                                            var obj = eval('(' + result + ')');

                                            if (obj.success) {
                                                BI.Msg.toast("保存成功！", {level: "success",});
                                                //location.reload();
                                            }
                                            else
                                                BI.Msg.toast("保存失败！请联系wangtao查看具体原因！", {level: "error",});
                                        }
                                    })

                                    if_not_submit=false;

                                }

                            }

            mounted: function() {
                let self = this;
                graph = self.graph =  new X6.Graph({
                    container: document.getElementById('graphContainer'),
                    grid: {
                        size: 10, // 网格大小 10px
                        visible: true, // 绘制网格，默认绘制 dot 类型网格
                    },
                    height: total_height,
                    panning:{
                        modifiers: 'shift',
                        enabled:true,
                    },

                    mousewheel: {
                        enabled: true,
                        minScale: 0.1,
                        factor:1.1,
                        maxScale: 3,
                    },
                    embedding: {
                        enabled: true,
                        findParent({ node }) {
                            const bbox = node.getBBox();
                            const nodeType = node.attr(".card").card_type;
                            return this.getNodes().filter((parentNOde) => {
                                const parentBBox = parentNOde.getBBox();
                                const parentType = parentNOde.attr(".card").card_type;

                                // 只有部门节点可以作为父节点
                                if (parentType !== 'dept') {
                                    return false;
                                }

                                // 只有当节点完全包含在部门节点内时才允许嵌入
                                // 使用 contains 检查是否完全包含
                                return parentBBox.containsRect(bbox);
                            });
                        },
                        validate: ({ child, parent }) => {
                            // 只有部门节点可以作为父节点
                            if (parent.attr(".card").card_type !== 'dept') {
                                return false;
                            }

                            const childBBox = child.getBBox();
                            const parentBBox = parent.getBBox();

                            // 验证子节点是否完全在父节点内部
                            return parentBBox.containsRect(childBBox);
                        },
                      },

                    connecting: {
                        router: 'manhattan',
                        connector: {
                            name: 'rounded',
                            args: {
                                radius: 8,
                            },
                        },
                        anchor: 'center',
                        connectionPoint: 'anchor',
                        allowBlank: false,
                        snap: {
                          radius: 20,
                        },
                        createEdge() {
                            return new X6.Shape.Edge({
                                attrs: {
                                    line: {
                                        stroke: '#A2B1C3',
                                        strokeWidth: 2,
                                        targetMarker: {
                                            name: 'block',
                                            width: 12,
                                            height: 8,
                                        },
                                    },
                                },
                                zIndex: 0,
                            })
                        },
                        validateConnection({ targetMagnet }) {
                            return !!targetMagnet
                        },
                    }

                });

                graph
                .use(
                    new X6PluginSelection.Selection({//选择框
                        rubberband: true,
                        showNodeSelectionBox: true,
                        //modifiers:['ctrl'],
                        filter: (cell) => {//隐藏了的节点不参与框选
                            return cell.visible
                        }
                    }),
                )
                .use(new X6PluginSnapline.Snapline())//定位线
                .use(new X6PluginKeyboard.Keyboard())//键盘操作
                .use(new X6PluginClipboard.Clipboard())// 剪切板
                .use(new X6PluginHistory.History())//历史步骤
                .use(new X6PluginExport.Export())//导出
                .use(new X6PluginTransform.Transform(
                    {
                        resizing: {
                          enabled: (node) => {
                            return node.attr(".card").card_type === "dept"
                          },
                        }

                    })
                )

                graph.bindKey(['meta+z', 'ctrl+z'], () => {
                    if_not_submit=true;
                    if (graph.canUndo()) {
                        graph.undo();
                        updateEdgeMap();//撤销后重新刷下edgemap
                        showhidebtn();
                        flushdragable();
                    }
                    return false;
                });


                //全选操作
                graph.bindKey(['shift+a'], () => {
                
                    const nodes = graph.getNodes();
                    nodes.forEach((node) => {
                        graph.select(node);
                    });
                });


                //导出图片
                graph.bindKey(['shift+s'], () => {
                    const watermark = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    watermark.setAttribute('font-size', '20'); // 水印的字体大小
                    watermark.setAttribute('fill', 'rgba(202, 206, 208, 0.6)'); // 水印的颜色和透明度
                    watermark.setAttribute("transform", "rotate(-25, 100, 50)");//倾斜角度
                    watermark.textContent = pic_watermark_str;


                    var export_options={}; 
                    export_options.preserveDimensions=true;

                    export_options.quality=1;
                    export_options.scale=4;
                    export_options.height=5000;
                    export_options.width=9000;
                    export_options.padding={top: 80,right: 80,bottom: 80,left: 80};
                    export_options.copyStyles=false;
                    export_options.beforeSerialize= (cell) =>{
                        // 在这里添加水印元素到 SVG 中
                        for(var i=0;i<9000;i+=400)
                        {
                            for(var j=0;j<5000;j+=400)
                            {
                                watermark.setAttribute('x', i-2000); // 水印的 x 坐标
                                watermark.setAttribute('y', j-2000); // 水印的 y 坐标
                                cell.appendChild(watermark.cloneNode(true));
                            }
                        }
                    }
                    

                    graph.exportPNG(tab_name,export_options);
    
                    //exportAsImage();
                    //信息记录
                    let ver_id=self.version_info.getValue()[0];
                    $.ajax({
                        url:serverName+'/WebReport/decision/url/power_map/upInfo',
                        method:'POST',
                        data:JSON.stringify({"up_type":"output","ver_id":ver_id}),
                        contentType: "application/json",
                        success: function(result){
                            var obj = eval('(' + result + ')');
                        }
                    })

                    BI.Msg.toast("导出成功")
                });


                graph.bindKey(['meta+y', 'ctrl+y'], () => {
                    if_not_submit=true;
                    if (graph.canRedo()) {
                        graph.redo();
                        updateEdgeMap();//重做后重新刷下edgemap
                        showhidebtn();
                        flushdragable();
                    }
                    return false;
                });

                graph.bindKey(['backspace','delete'], () => {
                    if_not_submit=true;
                    const cells = graph.getSelectedCells();
                    if (cells.length) {
                        var dele_cell=cells;
                        //如果选中的节点被折叠了，同时删除其所有子节点
                        for(var i=0;i<cells.length;i++)
                        {
                            var cell=cells[i];
                            var card=cell.attr('.card');
                            if(card!=undefined)
                            {
                                var judge=card.collapsed;
                                if(!judge)
                                    dele_cell=dele_cell.concat(graph.getSuccessors(cell));
                            }
                        }
                        graph.removeCells(dele_cell);

                        flushdragable();
                        updateEdgeMap();
                        showhidebtn();
                    }
                });

                graph.bindKey(['meta+c', 'ctrl+c'], () => {
                    if_not_submit=true;
                    const cells = graph.getSelectedCells()
                    if (cells.length) {
                        graph.copy(cells)
                    }
                    return false;
                });


                graph.on('node:close', ({ e, node }) => {

                    graph.getSelectedCells();
                    const son_arr = graph.getSuccessors(node, { distance: 1 })
                    if(son_arr.length>0){
                      var judge=node.attr('.card').collapsed;
                      node.attr('.card',{collapsed:!judge});
                      node.attr('.btn.close > text',{text:judge?"－":"＋"});
                      toggleCollapse(node,!judge);
                    }
                });




                //拖拽左侧节点到地图中时触发
                graph.on('node:added', ({ node }) => {
                    if_not_submit=true;
                    flushdragable();

                    let info_obj={};
                    info_obj.name=node.attr('.name').text;
                    info_obj.position=node.attr('.rank').text;
                    info_obj.department=node.attr('.dept_').text;
                    info_obj.phone=node.attr('.card').phone;
                    info_obj.information="";
                    info_obj.id=node.id;
                    info_obj.pid="";
                    info_obj.cont_id=node.attr('.card').cont_id;
                    info_obj.jdy_id=node.attr('.card').jdy_id;
                    info_obj.node_type=node.attr('.card').card_type;


                    var tagA_text=node.attr('.tagA > text').text;

                    if(tagA_text!=undefined)
                        info_obj.tagA=tagA_text;
                    else
                        info_obj.tagA="";

                    var tagB_text=node.attr('.tagB > text').text;
                    if(tagB_text!=undefined)
                        info_obj.tagB=tagB_text;
                    else
                        info_obj.tagB="";

                    info_obj.tagC="";
                    info_obj.tagC_arr="";
                    info_obj.tagD="";
                    info_obj.tagD_label="";
                    info_obj.tagD_level="";
                    info_obj.x="";
                    info_obj.y="";
                    info_obj.hobby="";
                    info_obj.school=""
                    info_obj.if_highLight="1";
                    info_obj.node_manager="0";//技术支持版本：中高层标记
                    info_obj.node_reach="0";//技术支持版本：是否触达标记
                    info_obj.tagD_other_abbr="";
                    info_obj.tagD_other_name="";
                    info_obj.attitude_arr=[];
                    objMap.set(node.id,info_obj);

                    if(info_obj.node_type=="dept")
                    {
                        info_obj.node_background='#e9f5e9';//默认浅绿色
                        node.attr('.card',{fill:"#e9f5e9"});
                        node.attr('.in_card',{fill:"#e9f5e9"});

                        node.resize(700, 350); 
                        node.attr('.name',{refY: 0.057}); 
                        node.setZIndex(0);//放在最底层
                    }
                    else
                    {
                        if(info_obj.phone=="")
                        {
                            node.attr('.card',{fill:"#fbefec"});
                            node.attr('.card',{stroke:"#fa6446"});
                            node.attr('.in_card',{fill:"#fbefec"});
                            node.attr('.name',{fill:"#e66546"});
                        }
                        //node.setZIndex(10);
                    }



                    //新增节点时判断是否有重叠，如果重叠给判断
                    var this_posi=node.position();

                    //可能重叠多个，选取举例最近的一个
                    var over_node=null;
                    var min_len=99999999;
                    const neighbors = graph.getNodes();
                    for (let i = 0, k; i < neighbors.length; i++) {
                        const neighbor = neighbors[i];
                        if(node.id!=neighbor.id)
                        {
                            var judge=neighbor.visible;//隐藏的节点不参与连线
                            if(judge)
                            {
                                let neighbor_position=neighbor.position();
                                var len=isRectangleOverlap(this_posi,neighbor_position)
                                if(len>=0)
                                {
                                    if(len<min_len){
                                        over_node=neighbor;
                                        min_len=len;
                                    }
                                }
                            }
                            
                        }
                    }

                    if(over_node!=null&&(over_node.attr('.card').card_type==info_obj.node_type)&&info_obj.node_type=="user")
                    {
                        BI.Msg.confirm("是否覆盖原节点【"+over_node.attr('.name').text+"】", "覆盖后，原节点的所有信息都将被替换，请谨慎选择！", function (v) {
                            if (v) {
                                over_node.attr('.name',{text:info_obj.name});
                                over_node.attr('.rank',{text:info_obj.position});
                                over_node.attr('.dept_',{text:info_obj.department});
                                over_node.attr('.card',{phone:info_obj.phone});
                                over_node.attr('.card',{cont_id:info_obj.cont_id});
                                over_node.attr('.card',{jdy_id:info_obj.jdy_id});


                                //覆盖后根据手机号设置背景
                                var inner_color="#FFF";

                                if(info_obj.phone==""){
                                    inner_color="#fbefec";
                                    card_fill="#fbefec";
                                    name_fill="#e66546";

                                over_node.attr('.card',{stroke:card_stroke});
                                over_node.attr('.card',{fill:card_fill});
                                over_node.attr('.in_card',{fill:inner_color});
                                over_node.attr('.name',{fill:name_fill});



                                info_obj.id=objMap.get(over_node.id).id;
                                info_obj.pid=objMap.get(over_node.id).pid;
                                info_obj.rela_change_rea="节点覆盖";

                /**
                 * 判断两个方块是否有重叠
                 * 不重叠返回-1，重叠返回举例长度
                 * */
                const isRectangleOverlap = function (rect1, rect2) {
                    // rect1 和 rect2 的格式为 {centerX, centerY, width, height}
                    // 计算两个长方形的边界坐标
                    const rect1Left = rect1.x;
                    const rect1Right = rect1.x + 160;
                    const rect1Top = rect1.y;
                    const rect1Bottom = rect1.y - 72;

                    const rect2Left = rect2.x;
                    const rect2Right = rect2.x + 160;
                    const rect2Top = rect2.y;
                    const rect2Bottom = rect2.y - 72;

                    // 判断是否重叠
                    // 如果一个长方形在另一个长方形的左边或者右边，或者一个长方形在另一个长方形的上面或者下面，则它们不重叠
                    if (rect1Right < rect2Left || rect1Left > rect2Right || rect1Top < rect2Bottom || rect1Bottom > rect2Top) {
                        return -1;//未重叠
                    } else {
                        
                        //重叠，获取两个坐标点之间的举例
                        return Math.pow((rect1Left - rect2Left),2) + Math.pow((rect1Top - rect2Top),2);
                    }
                }

                    },
                    zIndex: 0,
                  },
                  true,
                );
                

                //创建左侧工具栏--------------------------------------------------------------------------------
                self.options = {
                    title: '联系人列表',
                    target: self.graph,
                    search(cell, keyword) {
                        return cell.attr('.name').text.indexOf(keyword) !== -1
                    },
                    placeholder: '搜索联系人的名字',
                    notFoundText: '未查到',
                    collapsable: true,
                    stencilGraphWidth: 210,
                    stencilGraphHeight: 180,
                    groups: [{
                        name: 'contact-dept',
                        title: '新增部门',
                        collapsable: true,
                        graphHeight: 100,
                        layoutOptions: {
                            columns: 1,
                            columnWidth: 180,
                            rowHeight: 80,
                        },
                    },{
                        name: 'contact-cust',
                        title: '新增联系人',
                        collapsable: true,
                        graphHeight: 100,
                        layoutOptions: {
                            columns: 1,
                            columnWidth: 180,
                            rowHeight: 80,
                        },
                    },{
                        name: 'contact-crm',
                        title: 'CRM联系人',
                        collapsable: true,
                        collapsed:false,
                        graphHeight: 600,
                        layoutOptions: {
                            columns: 1,
                            columnWidth: 180,
                            rowHeight: 80,
                        },
                    }]
                };
                self_stencil = new X6PluginStencil.Stencil(self.options);
                document.getElementById('stencilContainer').appendChild(self_stencil.container);
                


                let background={};
                
                $.ajax({
                    url:serverName+'/WebReport/decision/url/power_map/getInfo?prj_type=company&prj_id='+com_id,
                    method:'get',
                    success: function(data){
                        if(data!="{}")
                        {
                            var obj = eval('(' + data + ')');
                            var err=obj.err;
                            if(err=="Login info not available!")
                                window.open(serverName+'/WebReport/decision', '_self');
                            else
                            {

                                //根据用户类型初始化部门拖拽：客户成功展示，非客户成功隐藏
                                if(obj.is_support){
                                    self_stencil.groups['contact-dept'].classList.remove('hidden');
                                    self_stencil.resizeGroup("contact-dept", { height: 100 });

                                    //添加空白部门，用于客户成功版本拖拽新增部门
                                    let cust_node=[];
                                    let init_node=createNode("","待编辑","","-",0,0,'dept',1);
                                    init_node.attr('.card',{fill:"#e9f5e9"});
                                    init_node.attr('.in_card',{fill:"#e9f5e9"});
                                    cust_node.push(init_node);
                                    self_stencil.load(cust_node, 'contact-dept');
                                }
                                else{
                                    self_stencil.resizeGroup("contact-dept", { height: 0 });
                                    self_stencil.groups['contact-dept'].classList.add('hidden');
                                }

                                //水印图片
                                picname=obj.picname;
                                background.repeat="watermark";
                                background.opacity=0.2;
                                background.image="watermark/"+picname+".png";
                                graph.drawBackground(background);

                                //初始化公司名称
                                self.cust_name.setValue(obj.company_name);

                                is_support=obj.is_support;

                                //客户成功，公司主版本的 提交按钮隐藏
                                if(is_support)
                                    self.total_submit.setVisible(false);
                                
                                 //初始化机会数据
                                opp_info=obj.opp_info;

                                //初始化owner
                                owner_info=obj.owner_info;

                                //初始化竞争对手
                                competitor_info=obj.competitor_info;
                                for(var c=0;c<competitor_info.length;c++)
                                {
                                    var competitor_obj=competitor_info[c];
                                    competitor_map.set(competitor_obj.value,competitor_obj.text);
                                }

                                //初始化版本信息：根据用户类型默认选中版本
                                exist_version=obj.version_info_copy;
                                version_arr=obj.version_info;

                                let defaultVersion=null;
                                for(let i=0;i<version_arr.length;i++){
                                    let v=version_arr[i];
                                    if(is_support && v && v["ver_name"]==="【客户成功】数据"){
                                        defaultVersion=v;
                                        break;
                                    }
                                    if(!is_support && v && (v["ver_name"] && (v["ver_name"].indexOf("【主】")>=0 || v["ver_name"].indexOf("【体系】")>=0))){
                                        defaultVersion=v;
                                        break;
                                    }
                                }
                                if(defaultVersion==null)
                                    defaultVersion=version_arr[0];

                                version_data=defaultVersion;
                                self.version_info.populate(version_arr);//版本下拉
                                self.version_info.setValue(version_data.value);//版本当前值
                                // 客户成功版本作为默认选项时，首次 company 初始化数据可能与该版本不匹配
                                // 触发一次按版本查询，确保无需手动点击版本也能加载对应数据
                                if(version_data && version_data["ver_name"]==="【客户成功】数据"){
                                    changeOpp(version_data.value,self);
                                }

                                his_page_size=obj.his_page_size;
                                his_totol_num=obj.his_totol_num;
                                history_info=obj.his_arr;//历史记录
                                for(let n=0;n<history_info.length;n++)
                                    history_size.push(60);

                                node_data=obj.node_info;

                                //创建节点
                                for(var x=0;x<node_data.length;x++)
                                    drawNode(node_data[x]);
                                

                                edge_data=obj.edge_info;
                                if(edge_data.length==0)
                                {
                                    for(var y=0;y<node_data.length;y++)
                                    {
                                        let data=node_data[y];
                                        let id=data["id"];
                                        let pid=data["pid"];
                                        if(pid!=""&&node_map.get(pid)!=undefined)
                                            edges.push(createEdge(node_map.get(pid),'port-bottom',node_map.get(id),'port-top'));
                                    }
                                }
                                else
                                {
                                    for(var y=0;y<edge_data.length;y++)
                                    {
                                        let data=edge_data[y];
                                        let target=data["target_id"];
                                        let source=data["source_id"];
                                        let edge=createEdge(node_map.get(source),data["source_port"], node_map.get(target),data["target_port"]);
                                        //颜色
                                        if(data["color"]!="")
                                            edge.attr('line/stroke', data["color"]);
                                        //类型
                                        if(data["edge_type"]=="normal")
                                        {
                                            edge.attr('line/strokeWidth', 6);
                                            edge.attr('line/targetMarker', {name: 'path',stroke: data["color"],d: 'M 0 0 10 -10 -10 0 10 10 0 0 z', offsetX: -8});
                                            edge.prop('zIndex', 99999);
                                            edge.prop('router', 'normal');
                                        }
                                        //备注
                                        if(data["edge_remark"]!="")
                                           edge.prop('labels',[{"attrs": {"label": {"text": data["edge_remark"]}}}]);

                                        edges.push(edge);
                                    }
                                }

                                graph.resetCells([...nodes, ...edges])
                                updateEdgeMap();
                                showhidebtn();//判断展示折叠按钮
                                init_close_node();//初始化，折叠部分节点

                                //客户成功版本：初始化节点组合（将人员节点组合到部门节点中）
                                // 使用 is_support 或 isCustomerSuccessVersion() 判断，确保初始化时能正确识别客户成功版本
                                if(is_support || isCustomerSuccessVersion()){
                                    // 使用图中实际节点进行组合
                                    // 注意：resetCells 后需要重新获取图中的节点，因为可能创建了新的实例
                                    let graph_nodes = graph.getNodes();
                                    // 重建 node_map，使用图中实际节点
                                    node_map.clear();
                                    for(let i=0;i<graph_nodes.length;i++){
                                        let n=graph_nodes[i];
                                        let nid=n.attr('.card').id;
                                        if(nid){
                                            node_map.set(nid,n);
                                        }
                                    }
                                    // 节点组合
                                    for(var p=0;p<graph_nodes.length;p++){
                                        var temp_node=graph_nodes[p];
                                        var combine_dept_id=temp_node.attr('.card').combine_dept;
                                        if(combine_dept_id!=""){
                                            var dept_node=node_map.get(combine_dept_id);
                                            if(dept_node){
                                                dept_node.addChild(temp_node);
                                            }
                                        }
                                    }
                                    //客户成功版本下：更新部门与人员之间的连线
                                    let graph_edges = graph.getEdges();
                                    for(var e=0;e<graph_edges.length;e++){
                                        updateSupportEdge(graph_edges[e]);
                                    }
                                    applyCustomerSuccessContainmentZOrder();
                                }

                                //添加空白联系人
                                let cust_node=[];
                                cust_node.push(createNode("待编辑","待编辑","待编辑","-",0,0,'user',1));
                                self_stencil.load(cust_node, 'contact-cust');

                                //添加crm联系人节点
                                addCrmCont(obj);

                                //添加简道云流程新增人员
                                jdy_post_node=obj.jdy_post_node;
                                var zhedie=false;//如果有简道云流程人员，需要折叠crm联系人
                                for (let node_tag in jdy_post_node) {

                                    var jdy_node_arr=jdy_post_node[node_tag].arr;
                                    var stencil_title=jdy_post_node[node_tag].name;

                                    var jdy_node_len=jdy_node_arr.length;
                                    var jdy_node=[];
                                    for(let n=0;n<jdy_node_len;n++)
                                    {
                                        let obj = jdy_node_arr[n];
                                        let node = createNode(obj["position"],obj["name"],obj["department"],"-",0,0,'user',1);
                                        jdy_node.push(node);
                                        node.attr('.card',{jdy_id:obj["id"]});//存简道云id

                                        //决策角色
                                        let tag_a_val=obj["tagA"];
                                        if(tag_a_val!=""){
                                            node.attr('.tagA',{display:""});
                                            node.attr('.tagA > text',{text:tag_a_val});
                                        }

                                        //与公司的关系，不同值对应不同颜色
                                        let tag_b_val=obj["tagB"];
                                        if(tag_b_val!="")
                                        {
                                            node.attr('.tagB',{display:""});
                                            node.attr('.tagB > text',{text:tag_b_val});

                                            let color="";
                                            if(tag_b_val=="1")//黄
                                                color="#fac750";
                                            else if(tag_b_val=="0")//灰
                                                color="#b7bbc5";
                                            else if(tag_b_val=="-1")//红
                                                color="#fa5b50";
                                            else //紫
                                                color="#a37af5";
                                            node.attr('.tagB > rect',{fill:color});
                                        }
                                    }
                                    zhedie=true;
                                    self_stencil.addGroup({
                                        name: node_tag,
                                        title: stencil_title,
                                        collapsable: true,
                                        graphHeight: 600,
                                        layoutOptions: {
                                            columns: 1,
                                            columnWidth: 180,
                                            rowHeight: 80,
                                        },
                                    });
                                    self_stencil.load(jdy_node, node_tag);
                                    self_stencil.resizeGroup(node_tag, { height: 80 * jdy_node_len + 30 });

                                    var tag_url=jdy_post_node[node_tag].url;
                                    if(tag_url!="")
                                        document.querySelector(".x6-widget-stencil-group[data-name='"+node_tag+"']>.x6-widget-stencil-group-title").innerHTML+= '<a href="'+tag_url+'" target="_blank"> 【查看】</a>'

                                }

                                //折叠crm联系人
                                if(zhedie)
                                    document.querySelector(".x6-widget-stencil-group[data-name='contact-crm']").classList.add("collapsed");

                                flushdragable();

                                graph.centerContent();
                            }
                        }
                        else
                        {
                            //没有权限
                            background.image="watermark/noauthority.png";
                            graph.drawBackground(background);

                            self.total_submit.setEnable(false);
                            self.version_submit.setEnable(false);

                        }

                    }
                });
            }
        });

        BI.shortcut("crm.x.handler", handler);

        /* 使用组件构建页面 */
        BI.createWidget({
            type: "bi.vertical",
            element: "#target",
            css: {backgroundColor: "rgba(35, 46, 64, 0.05)", overflow: "scroll"},
            items: [{
                type: "crm.x.tab",
            }]
        })

    })();


</script>
</body>
</html>
